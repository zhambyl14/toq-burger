<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Toq Burger Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Montserrat:wght@500;700;800;900&family=Unbounded:wght@700;900&display=block" rel="stylesheet">
<style>
  :root {
    --orange: #FF6A0A; --ink: #141210; --cream: #FFF6EC; --sand: #F3EADF; --peach: #FFF1E0;
    --rust: #C24D00; --muted: #6B6258; --green: #2E8B3F; --red: #B3261E; --kraft: #E7D5BC;
    --grain: none;
  }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--kraft); font-family: Montserrat, sans-serif; color: var(--ink); }
  .scene { position: absolute; inset: 0; perspective: 1800px; overflow: hidden; display: none; }
  .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-style: preserve-3d; transform-origin: 960px 540px; }
  .pc { position: absolute; transform-origin: 50% 50%; will-change: transform; }
  .p3 { transform-style: preserve-3d; }
  .paper { position: absolute; inset: 0; background-color: #fff; background-image: var(--grain); background-blend-mode: multiply; filter: url(#rough) drop-shadow(0 7px 7px rgba(70, 35, 0, .30)); }
  .paper.flat { filter: drop-shadow(0 7px 7px rgba(70, 35, 0, .30)); }
  .disp { font-family: Montserrat, Manrope, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
  .brand { font-family: Unbounded, Montserrat, sans-serif; }
  .lab { position: absolute; white-space: nowrap; padding: .12em .42em .18em; line-height: 1.05; }
  .lab > .paper { z-index: -1; }
  .lab > b, .lab > span { position: relative; }
  .full { position: absolute; inset: 0; }
  img { display: block; }
  .bgk { position: absolute; inset: -200px; transform: translateZ(-700px) scale(1.39); background-color: var(--kraft); background-image: var(--grain); background-blend-mode: multiply; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .chk { position: absolute; width: 26px; height: 26px; border-radius: 7px; background: var(--orange); color: #fff; font: 800 18px Montserrat; display: flex; align-items: center; justify-content: center; }
  #grainOv { position: absolute; inset: -40px; pointer-events: none; mix-blend-mode: multiply; opacity: .16; background-image: var(--grain); }
  #vign { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(60, 30, 5, .28) 100%); }
  .ico { position: absolute; }
  .pin { width: 46px; height: 46px; border-radius: 50%; background: var(--orange); border: 5px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,.3); }
  .tag { font: 800 22px Montserrat; background: var(--ink); color: var(--cream); padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence id="roughT" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="mbx" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="mbxG" stdDeviation="0 0"/></filter>
      <filter id="mby" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur id="mbyG" stdDeviation="0 0"/></filter>
      <filter id="mbl" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="mblG" stdDeviation="0 0"/></filter>
    </defs>
  </svg>
  <div id="scenes"></div>
  <div id="grainOv"></div>
  <div id="vign"></div>
</div>
<script src="vo/words.js"></script>
<script src="timeline.js"></script>
<script>
"use strict";
const C = TL.C, W = TL.W;
const $stage = document.getElementById("stage");
const $scenes = document.getElementById("scenes");

// ---------- math / time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: (t) => t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  io: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  io2: (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  back: (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  out5: (t) => 1 - Math.pow(1 - t, 5),
};
const seg = (t, a, b, e = E.io) => e(clamp((t - a) / (b - a)));
const st = (t) => Math.floor(t * 12 + 1e-6) / 12;            // stop-motion clock (12 fps)
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const boil = (seed, t, a = .4) => (hash(seed * 13.37 + Math.floor(t * 6)) - .5) * 2 * a;
const zs = (z) => (1800 - z) / 1800;                         // keeps layout size for depth-shifted layers

function T(el, o) {
  const x = o.x || 0, y = o.y || 0, z = o.z || 0, r = o.r || 0, s = o.s ?? 1;
  el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px)` +
    (o.rx ? ` rotateX(${o.rx}deg)` : "") + (o.ry ? ` rotateY(${o.ry.toFixed(3)}deg)` : "") +
    ` rotate(${r.toFixed(3)}deg) scale(${(o.sx ?? s).toFixed(4)},${(o.sy ?? s).toFixed(4)})`;
  if (o.o !== undefined) el.style.opacity = o.o;
}
// Paper piece entering with stop-motion steps: offset → rest, with overshoot and boil.
function enter(el, t, t0, f = {}, base = {}) {
  const d = f.d ?? .42, p = clamp((st(t) - t0) / d), e = (f.e || E.back)(p);
  const seed = f.seed ?? t0 * 7;
  T(el, {
    x: (base.x || 0) + (f.dx || 0) * (1 - e) + boil(seed, t, f.bo ?? 1.2),
    y: (base.y || 0) + (f.dy ?? 60) * (1 - e) + boil(seed + 3, t, f.bo ?? 1.2),
    z: base.z || 0,
    r: (base.r || 0) + (f.dr ?? -7) * (1 - e) + boil(seed + 5, t, f.br ?? .5),
    s: (base.s ?? 1) * lerp(f.ds ?? .8, 1, e),
    o: p > 0 ? 1 : 0,
  });
  return p;
}
function cam(scene, o) {
  scene.cam.style.transform =
    `translateZ(${(o.z || 0).toFixed(2)}px) rotateX(${(o.rx || 0).toFixed(3)}deg) rotateY(${(o.ry || 0).toFixed(3)}deg) rotateZ(${(o.rz || 0).toFixed(3)}deg) translate(${(-(o.x || 0)).toFixed(2)}px,${(-(o.y || 0)).toFixed(2)}px)`;
}
// Smooth camera dive toward a point (scene coords) between t0..t1.
function dive(o, t, t0, t1, px, py, zEnd = 1650) {
  const p = seg(t, t0, t1, E.in);
  o.x = lerp(o.x || 0, px - 960, seg(t, t0, t1, E.io2));
  o.y = lerp(o.y || 0, py - 540, seg(t, t0, t1, E.io2));
  o.z = lerp(o.z || 0, zEnd, p);
  o.rx = lerp(o.rx || 0, 0, p); o.ry = lerp(o.ry || 0, 0, p); o.rz = lerp(o.rz || 0, 0, p);
  return o;
}
function setBlur(id, sx, sy) { document.getElementById(id).setAttribute("stdDeviation", `${sx.toFixed(2)} ${sy.toFixed(2)}`); }

// ---------- DOM helpers ----------
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function scene(id) {
  const el = h(`<div class="scene" id="${id}"><div class="cam"></div></div>`);
  $scenes.appendChild(el);
  const sc = { el, cam: el.querySelector(".cam"), q: (s) => el.querySelector(s) };
  sc.add = (html) => { const n = h(html); sc.cam.appendChild(n); return n; };
  return sc;
}
// A text label cut from paper. bg = paper colour, fg = text colour.
function label(text, { x, y, size = 48, bg = "#fff", fg = "var(--ink)", font = "disp", w = 900, id = "", z = 0, extra = "" }) {
  return `<div class="pc lab ${font === "disp" ? "disp" : ""}" ${id ? `id="${id}"` : ""} style="left:${x}px;top:${y}px;font-size:${size}px;font-weight:${w};color:${fg};${extra}">
    <div class="paper" style="background-color:${bg}"></div><b>${text}</b></div>`;
}
const BOLT_SVG = (fill = "var(--orange)") => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M62 4 L20 58 L46 58 L36 96 L80 40 L54 40 Z" fill="${fill}"/></svg>`;
function logoSVG(id) {
  // TOK BURGER mark: white bun dome + base, orange bolt cutting through (pieces animate separately).
  return `<div class="pc p3" id="${id}" style="left:0;top:0;width:330px;height:280px">
    <svg class="pc" id="${id}Top" style="left:0;top:0;overflow:visible" width="330" height="160" viewBox="0 0 330 160">
      <path d="M8 160 C8 40 90 4 165 4 C240 4 322 40 322 160 Z" fill="#fff"/></svg>
    <svg class="pc" id="${id}Bot" style="left:0;top:150px;overflow:visible" width="330" height="130" viewBox="0 0 330 130">
      <path d="M8 0 H322 V96 Q322 126 292 126 H38 Q8 126 8 96 Z" fill="#fff"/></svg>
    <svg class="pc" id="${id}Bolt" style="left:0;top:70px;overflow:visible" width="330" height="170" viewBox="0 0 330 170">
      <path d="M0 78 L150 62 Q160 61 160 50 L160 20 Q160 8 172 12 L330 70 L330 88 L196 104 Q186 105 186 116 L186 150 Q186 162 174 158 L0 96 Z" fill="var(--orange)"/></svg>
  </div>`;
}
function person(id, color, x, y, tagText, s = 1) {
  return `<div class="pc" id="${id}" style="left:${x}px;top:${y}px;width:${120 * s}px;height:${230 * s}px">
    <div class="pc" style="left:${25 * s}px;top:${50 * s}px;width:${70 * s}px;height:${70 * s}px"><div class="paper" style="border-radius:50%;background-color:#F2C9A0"></div></div>
    <div class="pc" style="left:${8 * s}px;top:${112 * s}px;width:${104 * s}px;height:${118 * s}px"><div class="paper" style="border-radius:${46 * s}px ${46 * s}px ${12 * s}px ${12 * s}px;background-color:${color}"></div></div>
    ${tagText ? `<div class="pc tag" style="left:${-14 * s}px;top:0;font-size:${19 * s}px;transform:rotate(-6deg)">${tagText}</div>` : ""}
  </div>`;
}

// ---------- grain texture ----------
(function () {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), im = g.createImageData(256, 256);
  let s = 1234567;
  const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 215 + rnd() * 40 + (rnd() < .02 ? -40 : 0);
    im.data[i] = v; im.data[i + 1] = v * .985; im.data[i + 2] = v * .95; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  document.documentElement.style.setProperty("--grain", `url(${c.toDataURL()})`);
})();

const SC = {};

// =====================================================================
// S1 — receipt torn: a slice of every order goes to the aggregator
// =====================================================================
(function () {
  const s = SC.s1 = scene("S1");
  s.add(`<div class="bgk"></div>`);
  // background confetti (deep, defocused)
  const conf = [[180, 120, "#FF6A0A", 30], [1650, 140, "#C24D00", -20], [120, 900, "#FFF1E0", 15], [900, 1000, "#FF6A0A", 50], [1780, 470, "#FFF6EC", -40], [700, 70, "#FFF1E0", 10]];
  conf.forEach(([x, y, c, r], i) => s.add(`<div class="pc" id="s1c${i}" style="left:${x}px;top:${y}px;width:120px;height:80px;filter:blur(4px)"><div class="paper flat" style="background-color:${c};border-radius:14px;transform:rotate(${r}deg)"></div></div>`));
  // jagged tear line shared by receipt body and strip
  const pts = []; for (let i = 0; i <= 22; i++) pts.push([i / 22 * 100, 50 + (hash(i * 3.1) - .5) * 70]);
  // body: zigzag top (L→R), torn bottom (R→L); strip: torn top (L→R), straight bottom (R→L)
  const tearBody = pts.map(([x, y]) => `${x}% calc(100% - ${((70 - y) * .25).toFixed(1)}px)`).reverse().join(",");
  const tearStrip = pts.map(([x, y]) => `${x}% ${((y - 15) * .3).toFixed(1)}px`).join(",");
  const zig = []; for (let i = 0; i <= 24; i++) zig.push(`${(i / 24 * 100).toFixed(2)}% ${i % 2 ? 0 : 12}px`);
  s.add(`<div class="pc" id="s1rc" style="left:330px;top:150px;width:440px;height:660px">
    <div class="paper" style="clip-path:polygon(${zig.join(",")},${tearBody})"></div>
    <div class="pc" style="left:40px;top:44px;width:360px">
      <div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px">${BOLT_SVG()}</div><div class="disp brand" style="font-size:34px;font-weight:900">TOK BURGER</div></div>
      <div style="font:700 19px Montserrat;color:var(--muted);margin:10px 0 26px">Онлайн тапсырыс · чек</div>
      <div id="s1rows" style="font:700 25px Montserrat;line-height:1.95">
        <div class="row"><span>NEW CLASSIC</span><span>2 290 ₸</span></div>
        <div class="row"><span>Картоп фри</span><span>695 ₸</span></div>
        <div class="row"><span>Coca-Cola 0,5 л</span><span>695 ₸</span></div>
        <div style="border-top:3px dashed #cbbba8;margin:14px 0 8px"></div>
        <div class="row disp" style="font-size:30px;font-weight:900"><span>БАРЛЫҒЫ</span><span>3 680 ₸</span></div>
      </div>
    </div>
  </div>`);
  // box (aggregator): top face behind, strip, front face in front
  s.add(`<div class="pc" id="s1boxTop" style="left:1330px;top:560px;width:480px;height:110px"><div class="paper" style="background-color:#2a2420;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)"></div>
    <div class="pc" style="left:110px;top:42px;width:260px;height:34px;border-radius:50%;background:#000"></div></div>`);
  s.add(`<div class="pc" id="s1strip" style="left:330px;top:770px;width:440px;height:150px">
    <div class="paper" style="clip-path:polygon(${tearStrip},100% 100%,0 100%);top:-10px"></div>
    <div class="pc" style="left:36px;top:52px;font:800 24px Montserrat;color:var(--rust)">агрегатор үлесі</div>
    <div class="pc disp" style="left:320px;top:30px;width:86px;height:86px;border-radius:50%;background:var(--orange);color:#fff;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center">%</div>
  </div>`);
  s.add(`<div class="pc" id="s1boxFront" style="left:1330px;top:668px;width:480px;height:300px"><div class="paper" style="background-color:var(--ink);border-radius:0 0 18px 18px"></div>
    <div class="pc disp" style="left:0;width:480px;top:110px;text-align:center;color:var(--cream);font-size:44px;font-weight:900">АГРЕГАТОР</div></div>`);
  s.add(label("Әр тапсырыс сайын", { x: 960, y: 110, size: 46, font: "m", w: 800, id: "s1h1" }));
  s.add(label("табыстың бір бөлігі", { x: 930, y: 205, size: 76, bg: "var(--orange)", fg: "#fff", id: "s1h2" }));
  s.add(label("сізге емес —", { x: 960, y: 335, size: 60, id: "s1h3" }));
  s.add(label("агрегаторға кетеді", { x: 1040, y: 440, size: 46, bg: "var(--ink)", fg: "var(--cream)", id: "s1h4" }));
  s.el.appendChild(h(`<div class="full" id="s1dark" style="background:#0b0807;opacity:0"></div>`));
  const $ = (q) => s.q(q);
  const rows = [...$("#s1rows").children];

  s.update = (t) => {
    conf.forEach((c, i) => T($(`#s1c${i}`), { z: -500, s: 1 / zs(-500), r: boil(i, t, 1.5) }));
    enter($("#s1rc"), t, C.rcptIn, { dy: 700, dr: -10, d: .6, e: E.out }, { r: -3 });
    rows.forEach((r, i) => { r.style.opacity = st(t) >= .7 + i * .2 ? 1 : 0; });
    // tear: strip lifts off and flies into the box slot
    const strip = $("#s1strip");
    if (t < C.tear) enter(strip, t, C.rcptIn, { dy: 700, dr: -10, d: .6, e: E.out }, { r: -3 });
    else {
      const p1 = seg(st(t), C.tear, C.tear + .25, E.out);          // rip
      const p2 = seg(t, C.tear + .3, C.stripIn, E.io);             // flight (smooth: motion blur)
      const p3 = seg(t, C.stripIn - .05, C.stripIn + .35, E.in);  // drop into slot
      const fx = lerp(0, 1015, p2), fy = lerp(30 * p1, -300, p2) - Math.sin(p2 * Math.PI) * 160 + p3 * 180;
      T(strip, { x: fx, y: fy, r: -3 + p1 * 8 + p2 * 10, s: lerp(1, .62, p2), o: p3 < 1 ? 1 : 0 });
      strip.style.filter = p2 > 0 && p2 < 1 ? "url(#mbx)" : "none";
      setBlur("mbxG", Math.sin(p2 * Math.PI) * 14, 0);
    }
    const shake = t > C.stripIn && t < C.stripIn + .4 ? Math.sin((t - C.stripIn) * 60) * 6 * (1 - (t - C.stripIn) / .4) : 0;
    enter($("#s1boxTop"), t, .5, { dx: 300, dy: 0, d: .5 }, { x: shake });
    enter($("#s1boxFront"), t, .5, { dx: 300, dy: 0, d: .5 }, { x: shake, z: 2 });
    enter($("#s1h1"), t, W("s1", "әр") - .05, { dy: -40 }, { r: -2 });
    enter($("#s1h2"), t, W("s1", "табыстың") - .05, { dx: -80, dy: 0, dr: 6 }, { r: 1.5 });
    enter($("#s1h3"), t, W("s1", "сізге") - .05, { dy: 50 }, { r: -1.5 });
    enter($("#s1h4"), t, W("s1", "агрегаторға") - .05, { dx: 120, dy: 0 }, { r: 2 });
    const o = { x: lerp(-90, 110, seg(t, 0, 5.5)), y: lerp(-30, 20, seg(t, 0, 5.5)), z: lerp(-40, 70, seg(t, 0, 5.5)), ry: lerp(6, -4, seg(t, 0, 5.5)), rz: lerp(-1.4, .6, seg(t, 0, 5.5)) };
    dive(o, t, C.dive1, 6.5, 1570, 620, 1700);
    cam(s, o);
    $("#s1dark").style.opacity = seg(t, 6.15, 6.45, E.lin);
  };
})();

// =====================================================================
// S2 — customers walk into the aggregator box: the customer isn't yours
// =====================================================================
const PEOPLE = { t0: 7.4, gap: .9, hop: .38, dist: 130, x0: -170, hops: 9 };
(function () {
  const s = SC.s2 = scene("S2");
  s.add(`<div class="bgk" style="background-color:#DDC7A8"></div>`);
  s.add(`<div class="pc" id="s2floor" style="left:-200px;top:1000px;width:2400px;height:300px;background:#cdb391"></div>`);
  s.add(`<div class="pc" id="s2boxTop" style="left:980px;top:330px;width:520px;height:120px"><div class="paper" style="background-color:#2a2420;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)"></div>
    <div class="pc" style="left:120px;top:46px;width:280px;height:36px;border-radius:50%;background:#000"></div></div>`);
  const cols = ["var(--orange)", "var(--green)", "#3B6FB6", "var(--rust)"];
  const tags = ["+7 701 ••• ••", "+7 777 ••• ••", "+7 705 ••• ••", "+7 747 ••• ••"];
  cols.forEach((c, i) => s.add(person(`s2p${i}`, c, PEOPLE.x0, 770, tags[i])));
  s.add(`<div class="pc" id="s2boxFront" style="left:980px;top:448px;width:520px;height:560px"><div class="paper" style="background-color:var(--ink);border-radius:0 0 22px 22px"></div>
    <div class="pc disp" style="left:0;width:520px;top:46px;text-align:center;color:var(--cream);font-size:50px;font-weight:900">АГРЕГАТОР</div></div>`);
  const stick = [["+7 701 ••• ••", 1030, 600, -8], ["+7 777 ••• ••", 1250, 680, 6], ["тапсырыс тарихы", 1040, 790, 4], ["+7 705 ••• ••", 1230, 880, -5]];
  stick.forEach(([txt, x, y, r], i) => s.add(`<div class="pc tag" id="s2st${i}" style="left:${x}px;top:${y}px;font-size:26px;background:var(--cream);color:var(--ink);border-radius:6px">${txt}</div>`));
  s.add(label("Одан да маңыздысы", { x: 110, y: 110, size: 34, font: "m", w: 800, bg: "var(--peach)", id: "s2h0" }));
  s.add(label("Клиент те", { x: 100, y: 190, size: 88, id: "s2h1" }));
  s.add(label("сіздікі", { x: 120, y: 320, size: 88, bg: "var(--orange)", fg: "#fff", id: "s2h2" }));
  s.add(`<div class="pc disp" id="s2stamp" style="left:560px;top:318px;font-size:84px;font-weight:900;color:var(--red);border:9px solid var(--red);border-radius:14px;padding:0 22px;mix-blend-mode:multiply">ЕМЕС</div>`);

  s.add(badge("s9and", 1260, "Google Play", "Android қосымшасы"));
  const $ = (q) => s.q(q);

  s.update = (t) => {
    // bun-shaped iris opening from the right pan of the scale
    const R = SC.s8.R || [1430, 350], cx = R[0], cy = R[1] + 260;
    const k = seg(t, C.iris, 87.55, E.in) * 2600 + 1;
    if (t < 87.6) {
      const w = k, hgt = k * .8;
      s.el.style.clipPath = `path('M ${cx - w} ${cy + hgt * .35} C ${cx - w} ${cy - hgt}, ${cx + w} ${cy - hgt}, ${cx + w} ${cy + hgt * .35} L ${cx + w} ${cy + hgt * .6} L ${cx - w} ${cy + hgt * .6} Z')`;
    } else s.el.style.clipPath = "none";
    [0, 1].forEach((i) => T($(`#s9bb${i}`), { z: -450, s: 1 / zs(-450), r: boil(i + 90, t, 2) }));
    enter($("#s9LTop"), t, 87.7, { dy: -520, dr: -12, d: .4 });
    enter($("#s9LBot"), t, 88.0, { dy: 420, dr: 8, d: .4 });
    { const p = seg(t, 88.3, 88.62, E.out5), el = $("#s9LBolt"); T(el, { x: lerp(-900, 0, p), o: p > 0 ? 1 : 0 }); el.style.filter = p > 0 && p < .97 ? "url(#mbl)" : "none"; if (t > 87 && t < 89) setBlur("mblG", (1 - p) * 26, 0); }
    T($("#s9logo"), { z: 40, r: boil(91, t, .6) });
    enter($("#s9word"), t, 88.55, { dy: 120, ds: .7, d: .45 }, { z: 20 });
    enter($("#s9a"), t, C.ready - .05, { dx: -140, dy: 0 }, { r: -2, z: 20 });
    enter($("#s9b"), t, C.working - .1, { dx: 140, dy: 0 }, { r: 1.5, z: 20 });
    $("#s9dot").style.boxShadow = `0 0 0 ${8 + Math.sin(t * 6) * 5}px rgba(46,209,98,.3)`;
    enter($("#s9url"), t, C.working + .3, { dy: 30, d: .35 }, { z: 20 });
    enter($("#s9n"), t, C.next - .05, { dx: -120, dy: 0 }, { r: -2, z: 20 });
    enter($("#s9ios"), t, C.stores + .05, { dy: 200, dr: 8 }, { r: -2, z: 20 });
    enter($("#s9and"), t, C.stores + .3, { dy: 200, dr: -8 }, { r: 2, z: 20 });
    const o = { x: lerp(40, -30, seg(t, 87.5, 100)), y: lerp(-20, 15, seg(t, 87.5, 100)), z: lerp(160, 30, seg(t, 87.5, 89, E.out5)) + seg(t, 96, 100) * 40, ry: Math.sin((t - 87.5) * .5) * 3, rz: lerp(1.2, -.4, seg(t, 87.5, 100)) };
    cam(s, o);
  };
})();

// ---------- frame driver ----------
const ORDER = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9"];
const PRE = { s3: .3, s9: .6, s8: .7 };  // scenes revealed by masks/slides start drawing early
window.renderAt = function (t) {
  document.getElementById("roughT").setAttribute("seed", 2 + Math.floor(t * 6) % 5);
  ORDER.forEach((id) => {
    const sc = TL.byId[id], on = t >= sc.a - (PRE[id] || 0) && t < sc.b;
    SC[id].el.style.display = on ? "block" : "none";
    if (on) SC[id].update(t);
  });
  // S7 must stay visible while it slides out over S8's entry
  if (t >= 75.4 && t < 76) { SC.s7.el.style.display = "block"; SC.s7.update(t); }
  document.getElementById("grainOv").style.backgroundPosition = `${Math.floor(hash(Math.floor(t * 12)) * 256)}px ${Math.floor(hash(Math.floor(t * 12) + 7) * 256)}px`;
  // z-order: masked newcomer on top
  ["s3", "s9"].forEach((id) => { SC[id].el.style.zIndex = 5; });
  SC.s8.el.style.zIndex = 4;
};
window.ready = (async () => {
  // load every unicode-range subset (latin, cyrillic, cyrillic-ext) for every face in use,
  // then touch every scene once so no text is still in its font-display:block period
  const SAMPLE = "AaBb TOK 0123 ₸ → Абвгд ЕЁЖЗ эюя ҚқӘәҒғҮүҰұІіӨөҺһҢң";
  const faces = ["500 30px Montserrat", "700 30px Montserrat", "800 30px Montserrat", "800 30px Montserrat", "900 30px Montserrat", "700 30px Unbounded", "900 30px Unbounded"];
  await Promise.all(faces.map((f) => document.fonts.load(f, SAMPLE)));
  for (let t = 0; t < TL.DURATION; t += 2.5) renderAt(t);
  await document.fonts.ready;
  await new Promise((r) => setTimeout(r, 300));
  await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
  return true;
})();
// interactive preview: ?t=12.5 or play
const q = new URLSearchParams(location.search);
if (q.has("t")) window.ready.then(() => renderAt(+q.get("t")));
else if (q.has("play")) window.ready.then(() => { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % TL.DURATION); requestAnimationFrame(loop); }; loop(); });
</script>
