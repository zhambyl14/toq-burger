<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Toq Burger Pitch — 9:16</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --orange: #FF6A0A; --ink: #141210; --cream: #FFF6EC; --sand: #F3EADF; --peach: #FFF1E0;
    --rust: #C24D00; --muted: #6B6258; --green: #2E8B3F; --red: #B3261E; --kraft: #E7D5BC;
    --grain: none;
  }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--kraft); font-family: Montserrat, sans-serif; color: var(--ink); }
  .scene { position: absolute; inset: 0; perspective: 1800px; overflow: hidden; display: none; }
  .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-style: preserve-3d; transform-origin: 540px 960px; }
  .pc { position: absolute; transform-origin: 50% 50%; will-change: transform; }
  .p3 { transform-style: preserve-3d; }
  .paper { position: absolute; inset: 0; background-color: #fff; background-image: var(--grain); background-blend-mode: multiply; filter: url(#rough) drop-shadow(0 7px 7px rgba(70, 35, 0, .30)); }
  .paper.flat { filter: drop-shadow(0 7px 7px rgba(70, 35, 0, .30)); }
  .disp { font-family: Montserrat, Manrope, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
  .brand { font-family: Unbounded, Montserrat, sans-serif; }
  .lab { position: absolute; white-space: nowrap; padding: .12em .42em .18em; line-height: 1.05; }
  .lab > .paper { z-index: -1; }
  .lab > b, .lab > span { position: relative; }
  .full { position: absolute; inset: 0; }
  img { display: block; }
  .bgk { position: absolute; inset: -260px; transform: translateZ(-700px) scale(1.39); background-color: var(--kraft); background-image: var(--grain); background-blend-mode: multiply; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .chk { position: absolute; width: 26px; height: 26px; border-radius: 7px; background: var(--orange); color: #fff; font: 800 18px Montserrat; display: flex; align-items: center; justify-content: center; }
  #grainOv { position: absolute; inset: -40px; pointer-events: none; mix-blend-mode: multiply; opacity: .16; background-image: var(--grain); }
  #vign { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(60, 30, 5, .28) 100%); }
  #safe { position: absolute; inset: 0; pointer-events: none; display: none; }
  .ico { position: absolute; }
  .pin { width: 46px; height: 46px; border-radius: 50%; background: var(--orange); border: 5px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,.3); }
  .tag { font: 800 22px Montserrat; background: var(--ink); color: var(--cream); padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence id="roughT" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="mbx" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="mbxG" stdDeviation="0 0"/></filter>
      <filter id="mby" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur id="mbyG" stdDeviation="0 0"/></filter>
      <filter id="mbl" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="mblG" stdDeviation="0 0"/></filter>
      <filter id="mbz" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="mbzG" stdDeviation="0 0"/></filter>
    </defs>
  </svg>
  <div id="scenes"></div>
  <div id="grainOv"></div>
  <div id="vign"></div>
  <!-- TikTok UI overlay for previews only (?safe): top tabs, right action rail, bottom caption -->
  <div id="safe">
    <div style="position:absolute;left:0;top:0;width:1080px;height:150px;background:rgba(0,120,255,.25)"></div>
    <div style="position:absolute;right:0;top:880px;width:150px;height:760px;background:rgba(0,120,255,.25)"></div>
    <div style="position:absolute;left:0;bottom:0;width:1080px;height:330px;background:rgba(0,120,255,.25)"></div>
  </div>
</div>
<script src="vo/words.js"></script>
<script src="timeline.js"></script>
<script>
"use strict";
const C = TL.C, W = TL.cue;
const SW = TL.W, SH = TL.H, CX = SW / 2, CY = SH / 2;
const $stage = document.getElementById("stage");
const $scenes = document.getElementById("scenes");

// ---------- math / time helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: (t) => t,
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  io: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  io2: (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  back: (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  out5: (t) => 1 - Math.pow(1 - t, 5),
};
const seg = (t, a, b, e = E.io) => e(clamp((t - a) / (b - a)));
const st = (t) => Math.floor(t * 12 + 1e-6) / 12;            // stop-motion clock (12 fps)
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const boil = (seed, t, a = .4) => (hash(seed * 13.37 + Math.floor(t * 6)) - .5) * 2 * a;
const zs = (z) => (1800 - z) / 1800;                         // keeps layout size for depth-shifted layers

function T(el, o) {
  const x = o.x || 0, y = o.y || 0, z = o.z || 0, r = o.r || 0, s = o.s ?? 1;
  el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px)` +
    (o.rx ? ` rotateX(${o.rx}deg)` : "") + (o.ry ? ` rotateY(${o.ry.toFixed(3)}deg)` : "") +
    ` rotate(${r.toFixed(3)}deg) scale(${(o.sx ?? s).toFixed(4)},${(o.sy ?? s).toFixed(4)})`;
  if (o.o !== undefined) el.style.opacity = o.o;
}
// Paper piece entering with stop-motion steps: offset → rest, with overshoot and boil.
function enter(el, t, t0, f = {}, base = {}) {
  const d = f.d ?? .42, p = clamp((st(t) - t0) / d), e = (f.e || E.back)(p);
  const seed = f.seed ?? t0 * 7;
  T(el, {
    x: (base.x || 0) + (f.dx || 0) * (1 - e) + boil(seed, t, f.bo ?? 1.2),
    y: (base.y || 0) + (f.dy ?? 60) * (1 - e) + boil(seed + 3, t, f.bo ?? 1.2),
    z: base.z || 0,
    r: (base.r || 0) + (f.dr ?? -7) * (1 - e) + boil(seed + 5, t, f.br ?? .5),
    s: (base.s ?? 1) * lerp(f.ds ?? .8, 1, e),
    ry: base.ry,
    o: p > 0 && (base.o ?? 1) > 0 ? (base.o ?? 1) : 0,
  });
  return p;
}
function cam(scene, o) {
  scene.cam.style.transform =
    `translateZ(${(o.z || 0).toFixed(2)}px) rotateX(${(o.rx || 0).toFixed(3)}deg) rotateY(${(o.ry || 0).toFixed(3)}deg) rotateZ(${(o.rz || 0).toFixed(3)}deg) translate(${(-(o.x || 0)).toFixed(2)}px,${(-(o.y || 0)).toFixed(2)}px)`;
}
// Smooth camera dive toward a point (scene coords) between t0..t1.
function dive(o, t, t0, t1, px, py, zEnd = 1650) {
  const p = seg(t, t0, t1, E.in);
  o.x = lerp(o.x || 0, px - CX, seg(t, t0, t1, E.io2));
  o.y = lerp(o.y || 0, py - CY, seg(t, t0, t1, E.io2));
  o.z = lerp(o.z || 0, zEnd, p);
  o.rx = lerp(o.rx || 0, 0, p); o.ry = lerp(o.ry || 0, 0, p); o.rz = lerp(o.rz || 0, 0, p);
  return o;
}
function setBlur(id, sx, sy) { document.getElementById(id).setAttribute("stdDeviation", `${sx.toFixed(2)} ${sy.toFixed(2)}`); }
// exit helper: label flies up and away (with vertical motion blur) after t0
function leave(t, t0, d = .38) { return seg(t, t0, t0 + d, E.in); }

// ---------- DOM helpers ----------
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function scene(id) {
  const el = h(`<div class="scene" id="${id}"><div class="cam"></div></div>`);
  $scenes.appendChild(el);
  const sc = { el, cam: el.querySelector(".cam"), q: (s) => el.querySelector(s) };
  sc.add = (html) => { const n = h(html); sc.cam.appendChild(n); return n; };
  return sc;
}
// A text label cut from paper. bg = paper colour, fg = text colour.
function label(text, { x, y, size = 48, bg = "#fff", fg = "var(--ink)", font = "disp", w = 900, id = "", z = 0, extra = "" }) {
  return `<div class="pc lab ${font === "disp" ? "disp" : ""}" ${id ? `id="${id}"` : ""} style="left:${x}px;top:${y}px;font-size:${size}px;font-weight:${w};color:${fg};${extra}">
    <div class="paper" style="background-color:${bg}"></div><b>${text}</b></div>`;
}
const BOLT_SVG = (fill = "var(--orange)") => `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M62 4 L20 58 L46 58 L36 96 L80 40 L54 40 Z" fill="${fill}"/></svg>`;
function logoSVG(id) {
  // TOK BURGER mark: white bun dome + base, orange bolt cutting through (pieces animate separately).
  return `<div class="pc p3" id="${id}" style="left:0;top:0;width:330px;height:280px">
    <svg class="pc" id="${id}Top" style="left:0;top:0;overflow:visible" width="330" height="160" viewBox="0 0 330 160">
      <path d="M8 160 C8 40 90 4 165 4 C240 4 322 40 322 160 Z" fill="#fff"/></svg>
    <svg class="pc" id="${id}Bot" style="left:0;top:150px;overflow:visible" width="330" height="130" viewBox="0 0 330 130">
      <path d="M8 0 H322 V96 Q322 126 292 126 H38 Q8 126 8 96 Z" fill="#fff"/></svg>
    <svg class="pc" id="${id}Bolt" style="left:0;top:70px;overflow:visible" width="330" height="170" viewBox="0 0 330 170">
      <path d="M0 78 L150 62 Q160 61 160 50 L160 20 Q160 8 172 12 L330 70 L330 88 L196 104 Q186 105 186 116 L186 150 Q186 162 174 158 L0 96 Z" fill="var(--orange)"/></svg>
  </div>`;
}
function person(id, color, x, y, tagText, s = 1) {
  return `<div class="pc" id="${id}" style="left:${x}px;top:${y}px;width:${120 * s}px;height:${230 * s}px">
    <div class="pc" style="left:${25 * s}px;top:${50 * s}px;width:${70 * s}px;height:${70 * s}px"><div class="paper" style="border-radius:50%;background-color:#F2C9A0"></div></div>
    <div class="pc" style="left:${8 * s}px;top:${112 * s}px;width:${104 * s}px;height:${118 * s}px"><div class="paper" style="border-radius:${46 * s}px ${46 * s}px ${12 * s}px ${12 * s}px;background-color:${color}"></div></div>
    ${tagText ? `<div class="pc tag" style="left:${-14 * s}px;top:0;font-size:${19 * s}px;transform:rotate(-6deg)">${tagText}</div>` : ""}
  </div>`;
}
// Paper phone with a real site screenshot (414×868 layout box).
function phoneHTML(id, inner) {
  return `<div class="pc" id="${id}" style="left:0;top:0;width:414px;height:868px">
    <div class="paper" style="background-color:var(--ink);border-radius:56px"></div>
    <div class="pc" style="left:12px;top:12px;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--cream)">${inner}</div>
    <div class="pc" style="left:157px;top:24px;width:100px;height:26px;border-radius:13px;background:var(--ink)"></div>
  </div>`;
}

// ---------- grain texture ----------
(function () {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), im = g.createImageData(256, 256);
  let s = 1234567;
  const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 215 + rnd() * 40 + (rnd() < .02 ? -40 : 0);
    im.data[i] = v; im.data[i + 1] = v * .985; im.data[i + 2] = v * .95; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  document.documentElement.style.setProperty("--grain", `url(${c.toDataURL()})`);
})();

const SC = {};

// =====================================================================
// S0 — intro: a gift box drops in, the TOK BURGER app rises out of it (made for free)
// =====================================================================
(function () {
  const s = SC.s0 = scene("S0");
  s.add(`<div class="bgk"></div>`);
  const deep = [[40, 250, "#FF6A0A", 20], [900, 120, "#FFF1E0", -30], [930, 1560, "#C24D00", 40], [20, 1500, "#FFF6EC", -10], [860, 760, "#FFF1E0", 25], [120, 980, "#C24D00", -35]];
  deep.forEach(([x, y, c, r], i) => s.add(`<div class="pc" id="s0d${i}" style="left:${x}px;top:${y}px;width:130px;height:86px;filter:blur(4px)"><div class="paper flat" style="background-color:${c};border-radius:14px;transform:rotate(${r}deg)"></div></div>`));
  // box group: inside wall, phone, front, lid
  s.add(`<div class="pc p3" id="s0grp" style="left:0;top:0;width:1080px;height:1920px">
    <div class="pc" id="s0in" style="left:290px;top:1120px;width:500px;height:90px"><div class="paper flat" style="background-color:#8a3a00;border-radius:12px 12px 0 0;clip-path:polygon(0 100%,4% 0,96% 0,100% 100%)"></div></div>
    <div class="pc" id="s0well" style="left:0;top:0;width:1080px;height:1205px;overflow:hidden;perspective:1800px;perspective-origin:540px 900px">
      <div class="pc" id="s0phoneW" style="left:333px;top:466px;width:414px;height:868px">
        ${phoneHTML("s0phone", `<div class="pc" id="s0scr" style="left:0;top:0;width:390px"><img src="shots/home-kk.png" width="390"></div>`)}
      </div>
    </div>
    <div class="pc" id="s0front" style="left:270px;top:1180px;width:540px;height:390px">
      <div class="paper" style="background-color:var(--orange);border-radius:0 0 22px 22px"></div>
      <div class="pc" style="left:235px;top:0;width:70px;height:390px;background:var(--cream)"></div>
      <div class="pc" style="left:0;top:0;width:540px;height:22px;background:rgba(0,0,0,.18)"></div>
    </div>
    <div class="pc" id="s0lid" style="left:245px;top:1095px;width:590px;height:110px">
      <div class="paper" style="background-color:var(--orange);border-radius:14px"></div>
      <div class="pc" style="left:260px;top:0;width:70px;height:110px;background:var(--cream)"></div>
      <svg class="pc" style="left:175px;top:-118px;overflow:visible" width="240" height="130" viewBox="0 0 240 130">
        <path d="M120 112 C 70 20, 0 40, 30 100 C 50 130, 100 120, 120 112 Z" fill="var(--cream)" stroke="#e8d6bd" stroke-width="5"/>
        <path d="M120 112 C 170 20, 240 40, 210 100 C 190 130, 140 120, 120 112 Z" fill="var(--cream)" stroke="#e8d6bd" stroke-width="5"/>
        <circle cx="120" cy="110" r="20" fill="var(--cream)" stroke="#e8d6bd" stroke-width="5"/></svg>
    </div>
  </div>`);
  // confetti burst (in front, some near the lens)
  const CONF = [];
  for (let i = 0; i < 18; i++) {
    const a = -Math.PI / 2 + (hash(i * 3.3) - .5) * 2.3, v = 900 + hash(i * 7.1) * 900;
    CONF.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v, z: (hash(i * 5.7) - .35) * 700, spin: (hash(i) - .5) * 900,
      c: ["var(--orange)", "var(--cream)", "var(--rust)", "#FFC23A", "var(--green)", "#fff"][i % 6], w: 26 + hash(i * 2.2) * 30, h: 16 + hash(i * 9.4) * 18 });
  }
  CONF.forEach((c, i) => s.add(`<div class="pc" id="s0c${i}" style="left:540px;top:1150px;width:${c.w}px;height:${c.h}px;background:${c.c};border-radius:4px;box-shadow:0 3px 4px rgba(70,35,0,.25)"></div>`));
  // sparkles around the phone
  const SPK = [[300, 560, 1], [760, 640, .7], [250, 980, .6], [800, 1010, .9]];
  SPK.forEach(([x, y, k], i) => s.add(`<svg class="pc" id="s0s${i}" style="left:${x - 40 * k}px;top:${y - 40 * k}px" width="${80 * k}" height="${80 * k}" viewBox="0 0 80 80"><path d="M40 0 C44 30 50 36 80 40 C50 44 44 50 40 80 C36 50 30 44 0 40 C30 36 36 30 40 0Z" fill="#fff"/></svg>`));
  // copy, part 1 — what I did
  s.add(label("TOK BURGER-дің", { x: 70, y: 175, size: 58, id: "s0h1" }));
  s.add(label("приложениесін", { x: 50, y: 270, size: 92, bg: "var(--orange)", fg: "#fff", id: "s0h2" }));
  s.add(label("жасап бердім", { x: 80, y: 415, size: 60, bg: "var(--ink)", fg: "var(--cream)", id: "s0h3" }));
  s.add(`<div class="pc disp" id="s0free" style="left:640px;top:398px;font-size:86px;font-weight:900;color:var(--red);border:9px solid var(--red);border-radius:16px;padding:0 22px;mix-blend-mode:multiply">ТЕГІН</div>`);
  // copy, part 2 — the question
  s.add(label("Сіздерге", { x: 95, y: 180, size: 46, font: "m", w: 800, bg: "var(--peach)", id: "s0q0" }));
  s.add(label("ол қалай", { x: 90, y: 262, size: 100, id: "s0q1" }));
  s.add(label("жұмыс жасайды?", { x: 80, y: 405, size: 74, bg: "var(--orange)", fg: "#fff", id: "s0q2" }));
  s.el.appendChild(h(`<div class="full" id="s0end" style="background:var(--cream);opacity:0"></div>`));
  const $ = (q) => s.q(q);

  s.update = (t) => {
    deep.forEach((c, i) => T($(`#s0d${i}`), { z: -520, s: 1 / zs(-520), r: boil(i + 60, t, 1.5) }));
    // box drops in and lands with a squash
    const land = clamp((t - C.boxLand) / .3), squash = t > C.boxLand ? Math.sin(land * Math.PI) * (1 - land) * .07 : 0;
    { const p = seg(t, C.boxIn, C.boxLand, E.in);
      T($("#s0grp"), { y: lerp(-1500, 0, p), r: lerp(-7, 0, p) + boil(3, t, .25), sx: 1 + squash, sy: 1 - squash, o: 1 });
      $("#s0grp").style.transformOrigin = "540px 1570px";
      $("#s0grp").style.filter = p > 0 && p < 1 ? "url(#mby)" : "none"; setBlur("mbyG", 0, p > 0 && p < 1 ? 22 * p : 0); }
    // lid pops off (ballistic, spinning out of frame)
    { const dt = Math.max(0, t - C.lid), lid = $("#s0lid");
      T(lid, { x: dt * 900, y: -dt * 2300 + dt * dt * 2600, z: dt * 300, r: dt * 95, o: dt < 1.1 ? 1 : 0 });
      lid.style.filter = dt > 0 && dt < 1.1 ? "url(#mbz)" : "none"; setBlur("mbzG", dt > 0 ? 6 : 0, dt > 0 ? 6 : 0); }
    // the app rises out of the box
    { const p = seg(t, C.app, C.app + .7, E.back), turn = seg(t, C.show - .4, C.show + .3, E.io);
      T($("#s0phoneW"), { y: lerp(760, 0, p) + Math.sin(t * 1.6) * 6 * p, r: lerp(4, -2, p) * (1 - turn) + boil(9, t, .3), s: .88, ry: lerp(-16, 0, turn) + Math.sin(t * .9) * 4 * (1 - turn), o: t > C.app ? 1 : 0 }); }
    T($("#s0scr"), { y: -seg(t, C.app + .9, C.dive0, E.io) * 420 });
    CONF.forEach((c, i) => {
      const dt = Math.max(0, t - C.lid), g = 1900;
      T($(`#s0c${i}`), { x: c.vx * dt * .9, y: c.vy * dt + .5 * g * dt * dt, z: c.z, r: c.spin * dt, o: dt > 0 && dt < 2.2 ? 1 : 0 });
    });
    SPK.forEach((sp, i) => { const tc = C.app + .4 + i * .18, p = clamp((t - tc) / .5);
      T($(`#s0s${i}`), { s: p > 0 ? (Math.sin(p * Math.PI) * .9 + .1 * (p >= 1 ? (1 + Math.sin((t - tc) * 5)) * .5 : 0)) : 0, r: t * 40, o: p > 0 && t < C.dive0 ? 1 : 0 }); });
    // part 1 copy, then it flies up to make room for the question
    const out = [0, 1, 2].map((i) => leave(st(t), C.ask + i * .06));
    enter($("#s0h1"), t, C.tb - .05, { dx: -120, dy: 0 }, { r: -2, y: -900 * out[0], o: out[0] < 1 ? 1 : 0 });
    enter($("#s0h2"), t, C.app - .05, { dy: 80, dr: 6 }, { r: 1.2, y: -900 * out[1], o: out[1] < 1 ? 1 : 0 });
    enter($("#s0h3"), t, C.made - .05, { dx: 120, dy: 0 }, { r: -1.5, y: -900 * out[2], o: out[2] < 1 ? 1 : 0 });
    { const p = clamp((st(t) - C.free) / .25), o2 = out[2]; T($("#s0free"), { s: lerp(2.4, 1, E.out(p)), r: -9, y: -900 * o2, o: p > 0 && o2 < 1 ? .93 : 0 }); }
    enter($("#s0q0"), t, W("s0", "сіздерге") - .05, { dy: -50 }, { r: -2 });
    enter($("#s0q1"), t, C.how - .05, { dx: -140, dy: 0, dr: -5 }, { r: -1.5 });
    enter($("#s0q2"), t, C.work - .05, { dy: 90, dr: 7 }, { r: 1.5 });
    // camera: high, slightly tilted look down at the table → rise with the phone → dive into its screen

        r: lerp((hash(i) - .5) * 80, (i % 2 ? 4 : -4), e) + boil(i * 11 + 2, t, .5), s: lerp(1, .86, settle), o: p > 0 ? 1 : 0 });
    });
    // "ЖАЗЫҢЫЗ" slams in, the bubble types
    { const p = clamp((st(t) - C.write + .04) / .3);
      T($("#s10cta"), { s: lerp(2.6, 1, E.out(p)) * (1 + Math.max(0, Math.sin((t - C.write - .3) * 3)) * .025 * (t > C.write + .3 ? 1 : 0)), r: lerp(-8, -1.5, E.out(p)) + boil(71, t, .3), z: 60, o: p > 0 ? 1 : 0 });
      $("#s10ul").style.width = `${seg(t, C.write + .35, C.write + .8, E.out) * 520}px`; }
    enter($("#s10bub"), t, C.write + .25, { dx: 160, dy: 80, dr: 18, d: .4 }, { r: 3, z: 70 });
    for (let i = 0; i < 3; i++) T($(`#s10dot${i}`), { y: -Math.max(0, Math.sin((t - C.write) * 7 - i * .9)) * 16, o: t > C.write + .35 ? 1 : 0 });
    { const rp = ((t - C.write - .8) * .7) % 1; T($("#s10ring"), { s: 1 + rp * .5, z: 65, o: t > C.write + .8 ? (1 - rp) * .8 : 0 }); }
    // camera: continuous slow orbit, slight push toward the CTA, then settles for the final read
    const k2 = seg(t, A, B);
    const o = { x: lerp(-50, 20, k2), y: lerp(-80, 120, seg(t, A, C.write + 1.2)), z: lerp(140, 0, seg(t, A, A + 1.4, E.out5)) + seg(t, C.write - .4, C.write + 1.5) * 90 + Math.max(0, t - C.write - 1.5) * 6,
      ry: lerp(-5, 3, k2), rx: lerp(3, -1, k2), rz: lerp(-1, .5, k2) };
    const hit = t > C.write && t < C.write + .4 ? (1 - (t - C.write) / .4) : 0;
    o.x += Math.sin(t * 80) * 10 * hit; o.y += Math.cos(t * 70) * 8 * hit;
    cam(s, o);
  };
})();

// ---------- frame driver ----------
const ORDER = ["s0", "s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9", "s10"];
const PRE = { s3: .3, s9: .6, s8: .7, s10: .45 };  // scenes revealed by masks/slides start drawing early
window.renderAt = function (t) {
  document.getElementById("roughT").setAttribute("seed", 2 + Math.floor(Math.abs(t) * 6) % 5);
  ORDER.forEach((id) => {
    const sc = TL.byId[id], on = t >= sc.a - (PRE[id] || 0) && t < sc.b;
    SC[id].el.style.display = on ? "block" : "none";
    if (on) SC[id].update(t);
  });
  if (t >= 75.4 && t < 76) { SC.s7.el.style.display = "block"; SC.s7.update(t); }
  // the last frame of the video keeps the outro on screen
  if (t >= TL.END) { SC.s10.el.style.display = "block"; SC.s10.update(t); }
  document.getElementById("grainOv").style.backgroundPosition = `${Math.floor(hash(Math.floor(t * 12)) * 256)}px ${Math.floor(hash(Math.floor(t * 12) + 7) * 256)}px`;
  ["s3", "s9", "s10"].forEach((id) => { SC[id].el.style.zIndex = 5; });
  SC.s8.el.style.zIndex = 4;
};
window.ready = (async () => {
  const SAMPLE = "AaBb TOK 0123 ₸ → Абвгд ЕЁЖЗ эюя ҚқӘәҒғҮүҰұІіӨөҺһҢң";
  const faces = ["500 30px Montserrat", "700 30px Montserrat", "800 30px Montserrat", "900 30px Montserrat", "700 30px Unbounded", "900 30px Unbounded"];
  await Promise.all(faces.map((f) => document.fonts.load(f, SAMPLE)));
  for (let t = TL.START; t < TL.END; t += 2.5) renderAt(t);
  await document.fonts.ready;
  await new Promise((r) => setTimeout(r, 300));
  await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
  return true;
})();
// interactive preview: ?t=12.5 (story time), ?play, ?safe (TikTok UI zones)
const q = new URLSearchParams(location.search);
if (q.has("safe")) document.getElementById("safe").style.display = "block";
if (q.has("t")) window.ready.then(() => renderAt(+q.get("t")));
else if (q.has("play")) window.ready.then(() => { const t0 = performance.now(); const loop = () => { renderAt(TL.START + ((performance.now() - t0) / 1000) % TL.DURATION); requestAnimationFrame(loop); }; loop(); });
</script>
